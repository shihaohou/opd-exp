# E1 Config A — VanillaKD (baseline)
# Loss: Σ_t KL_topK(P_T^I(.|s_t) || P_S(.|s_t)) on student-rollout prefixes.
# No delta_t weighting, no teacher-correct filtering.
# Role: existing-OPD baseline we want to beat. See README.md § Configs.
#
# The worker patch detects need_delta=False from the loss_mode name and skips
# the null teacher forward (image forward only) — see agent_loop.py for the
# branching logic. Saves ~50% teacher GPU time vs B/D.

# Hydra requires `searchpath` on the *primary* config (= the file Hydra loads
# first via --config-name). Declaring it on the intermediate e1_base is too
# late because the `defaults: [ppo_trainer]` resolution starts before e1_base's
# own hydra.searchpath would be read.
hydra:
  searchpath:
    - pkg://verl.trainer.config
    - file://verl/verl/trainer/config

defaults:
  - e1_base
  - _self_

distillation:
  distillation_loss:
    loss_mode: e1_onpolicy_vanilla_kd

trainer:
  experiment_name: e1_A_vanilla_kd
