# E1 Config D — FilteredDeltaKD (primary candidate)
# Loss (per-sample dispatch via agent_loop + losses.py):
#   if T_correct: Σ_t w_t · KL_topK(P_T^I || P_S)
#   else:         β · NLL(student | "Final answer: \boxed{X}.")   ← CE-on-gold
# Role: the actual E1 method under test. Central comparisons:
#   D vs C — does delta help GIVEN filtering? (the hypothesis)
#   D vs B — does filtering rescue the raw-delta failure on VLMBias?
#   D vs A — net gain over the existing-OPD baseline (must clear C's lift first)
#
# See on_policy_v1_design.md § 1 for the full per-sample loop and § 5 for the
# mandatory monitoring metrics (kl_ce_ratio, effective_kl_tokens, etc.).
# Null teacher forward runs ONLY on teacher-correct samples (CE samples go
# through the CE-on-gold branch and don't need delta) — worker patch handles.

hydra:
  searchpath:
    - pkg://verl.trainer.config
    - file://verl/verl/trainer/config

defaults:
  - e1_base
  - _self_

distillation:
  distillation_loss:
    loss_mode: e1_onpolicy_filtered_delta_kd

trainer:
  experiment_name: e1_D_filtered_delta_kd
