# E1 Config C — FilteredKD (critical control)
# Loss (per-sample dispatch):
#   if T_correct: Σ_t KL_topK(P_T^I || P_S)
#   else:         0           ← mask-only in this first cut (CE-on-gold deferred)
# Role: isolates the contribution of teacher-correctness filtering from
# delta_t weighting. WITHOUT C in the sweep, any D > A gain is unattributable
# to delta. Do NOT drop C from the sweep — see NEXT.md § Hard rules.
#
# NOTE: First-cut Stage 2 uses mask-only filtering (zero KL on teacher-wrong
# samples). The locked v1 design replaces zero with β · CE(student | gold).
# Switching requires per-sample rollout branching at the agent loop level;
# tracked as the v1.5 milestone (NEXT.md open question #7).

defaults:
  - e1_base
  - _self_

distillation:
  distillation_loss:
    loss_mode: e1_onpolicy_filtered_kd

trainer:
  experiment_name: e1_C_filtered_kd
