# E1 Config C — FilteredKD (critical control)
# Loss (per-sample dispatch via agent_loop + losses.py):
#   if T_correct: Σ_t KL_topK(P_T^I || P_S)
#   else:         β · NLL(student | "Final answer: \boxed{X}.")   ← CE-on-gold
# Role: isolates the contribution of teacher-correctness filtering + CE-on-gold
# from delta_t weighting. WITHOUT C in the sweep, any D > A gain is unattributable
# to delta. Do NOT drop C from the sweep — see NEXT.md § Hard rules.
#
# Worker patch skips null teacher forward (need_delta=False), saving ~50%
# teacher GPU time.

hydra:
  searchpath:
    - pkg://verl.trainer.config
    - file://verl/verl/trainer/config

defaults:
  - e1_base
  - _self_

distillation:
  distillation_loss:
    loss_mode: e1_onpolicy_filtered_kd

trainer:
  experiment_name: e1_C_filtered_kd
