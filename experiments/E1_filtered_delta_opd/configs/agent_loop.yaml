# Registers Delta-OPD's custom agent loop with verl.
#
# verl's AgentLoopWorker loads this list at startup (via
# rollout.agent.agent_loop_config_path) and instantiates by name through
# Hydra. The Python class is materialized lazily by the module-level
# __getattr__ in experiments/E1_filtered_delta_opd/src/on_policy/agent_loop.py.
- name: delta_opd_single_turn
  _target_: experiments.E1_filtered_delta_opd.src.on_policy.agent_loop.DeltaOPDAgentLoop
